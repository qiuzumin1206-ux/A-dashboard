<script>
const form = document.getElementById('unlock-form');
const passwordInput = document.getElementById('password');
const button = document.getElementById('unlock');
const statusNode = document.getElementById('status');
const payload = JSON.parse(document.getElementById('encrypted-dashboard').textContent);
const textEncoder = new TextEncoder();
const textDecoder = new TextDecoder();

function fromBase64(value) {
  const raw = atob(value);
  return Uint8Array.from(raw, ch => ch.charCodeAt(0));
}

async function unlock(password) {
  const material = await crypto.subtle.importKey(
    'raw', textEncoder.encode(password), 'PBKDF2', false, ['deriveKey']
  );
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2',salt:fromBase64(payload.salt),iterations:payload.iterations,hash:'SHA-256'},
    material,
    {name:'AES-GCM',length:256},
    false,
    ['decrypt']
  );
  const clear = await crypto.subtle.decrypt(
    {name:'AES-GCM',iv:fromBase64(payload.iv),additionalData:textEncoder.encode('a-share-dashboard-v1')},
    key,
    fromBase64(payload.ciphertext)
  );
  return textDecoder.decode(clear);
}

form.addEventListener('submit', async event => {
  event.preventDefault();
  button.disabled = true;
  statusNode.className = 'status';
  statusNode.textContent = '正在本地解密…';
  try {
    const html = await unlock(passwordInput.value);
    passwordInput.value = '';
    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    statusNode.className = 'status bad';
    statusNode.textContent = '密码不正确，或密文已损坏。';
    button.disabled = false;
    passwordInput.select();
  }
});
</script>
